# =============================================================================
# Multi-Agent Debate — Konfiguracja
# =============================================================================
# Zmień dowolny parametr i uruchom ponownie: python main.py

# --- Model ---
model_name: "speakleash/Bielik-1.5B-v3.0-Instruct"
# speakleash/Bielik-1B-Instruct-v0.1
# "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

# --- Urządzenie ---
device: "cpu"             # cpu | cuda | mps (Apple Silicon — może nie działać z każdym modelem)

# --- Generowanie ---
temperature: 0.7          # 0.0 = deterministyczny, 1.0+ = kreatywny
max_new_tokens: 256       # maks. długość odpowiedzi agenta
do_sample: true           # false = greedy decoding (ignoruje temperature)

# --- Debata ---
architecture: "round_robin"   # round_robin | relay | free_for_all
num_rounds: 2                 # ile rund debaty
topic: "Firma ma kłopoty finansowe. Czy lepiej jest zwolnić 30% pracowników, żeby uratować pozostałych 70%, czy wszystkim obniżyć wypłatę o 20%, ale nikogo nie zwalniać?"

# --- Protokół decyzyjny (jak wybieramy ostateczną odpowiedź po debacie) ---
# Inspiracja: Kaesberg et al. 2025 "Voting or Consensus?" (arXiv:2502.19130)
#   judge     — niezależny sędzia podsumowuje debatę (baseline)
#   voting    — każdy agent proponuje finalną odpowiedź i głosuje
#   consensus — agenci iteracyjnie zbliżają się do wspólnej odpowiedzi
decision_protocol: "consensus"

# Parametry konsensusu (używane tylko gdy decision_protocol = "consensus")
consensus_threshold: 1.0      # 0.5 = majority, 0.66 = supermajority, 1.0 = unanimity
max_consensus_rounds: 3        # ile rund prób osiągnięcia zgody

# --- Agenci ---
agents:
  - name: "Asekurant"
    system_prompt: "Jesteś osobą lękliwą, skrajnie ostrożną i nieufną wobec nowości. Zanim wyrazisz swoje zdanie, zapoznaj się z wypowiedzią drugiego rozmówcy. Jeśli historia jest pusta, to znaczy, że zaczynasz dyskusję - wówczas przedstaw swoj punkt widzenia w sposób możliwie przekonujący dla Twojego rozmówcy. Waszym celem jest możliwie szybko wspólnie znaleźć najlepsze rozwiązanie zadanego tematu."

  - name: "Ryzykant"
    system_prompt: "Jesteś osobą bardzo odważną i czerpiesz satysfakcję z podejmowania niebezpiecznych, ekstremalnych decyzji. Prowadzisz rozmowę i szukasz wspólnej odpowiedzi. Zanim wyrazisz swoje zdanie, zapoznaj się z wypowiedzią drugiego rozmówcy. Waszym celem jest możliwie szybko znaleźć najlepsze rozwiązanie zadanego tematu."

# --- Sędzia (używany tylko gdy decision_protocol = "judge") ---
judge:
  system_prompt: "Jesteś sędzią debaty. Podsumuj argumenty wszystkich stron i oceń kto był najbardziej przekonujący. Odpowiedz w 3-5 zdaniach."
