model_name: speakleash/Bielik-1.5B-v3.0-Instruct
device: cpu
temperature: 0.7
max_new_tokens: 200
do_sample: true
seed: 137
architecture: round_robin
num_rounds: 3
topic: Firma ma kłopoty finansowe. Czy lepiej jest zwolnić 30% pracowników, żeby uratować
  pozostałych 70%, czy wszystkim obniżyć wypłatę o 20%, ale nikogo nie zwalniać?
decision_protocol: consensus
consensus_threshold: 1.0
max_consensus_rounds: 8
agents:
- name: Wrażliwy
  system_prompt: Jesteś osobą wrażliwą i ostrożną. Bierzesz udział w debacie. Przedstaw
    swoje stanowisko i je uzasadnij. Odnoś się do argumentów drugiej strony. Odpowiadaj
    krótko, maksymalnie 3-4 zdania. Zwracaj wyłącznie czysty tekst.
- name: Stabilny
  system_prompt: Jesteś osobą spokojną i odporną na stres. Bierzesz udział w debacie.
    Przedstaw swoje stanowisko i je uzasadnij. Odnoś się do argumentów drugiej strony.
    Odpowiadaj krótko, maksymalnie 3-4 zdania. Zwracaj wyłącznie czysty tekst.
